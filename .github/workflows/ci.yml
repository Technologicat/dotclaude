name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          # 3.15 is at rc1, which the setup-python manifest marks unstable, so a bare
          # "3.15" resolves to nothing without this. Versions that have a stable release
          # are unaffected — a prerelease is only used when no stable one satisfies the
          # request. Becomes a no-op once 3.15 final ships.
          allow-prereleases: true

      - name: Install PDM
        run: pip install pdm

      - name: Install dependencies
        run: |
          # Point PDM at the interpreter `setup-python` already installed, rather than
          # letting it fetch a second one — its index has no prerelease build, so asking
          # for a version like "3.15" fails while that very interpreter is on PATH.
          pdm use -f "$(python -c 'import sys; print(sys.executable)')"
          pdm install

      - name: Lint Python with ruff
        run: pdm run ruff check . --ignore SIM103

      - name: Lint advisories (non-blocking)
        run: pdm run ruff check . --select SIM103 || true

      - name: Run tests
        run: pdm run pytest -v

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ShellCheck is preinstalled on the ubuntu runner images.
      # `scripts/em` has no extension, so list scripts explicitly rather than globbing *.sh —
      # a glob would silently skip it, which is the one most likely to be edited by hand.
      - name: Lint shell scripts
        # The version comes with the image and moves when GitHub rebuilds it, so print it: a new
        # rule in a newer ShellCheck turns unchanged scripts red, and the log is the only place
        # that distinguishes it from a real regression — or from a local copy that is older and
        # therefore quieter (Ubuntu noble ships 0.9.0).
        run: |
          shellcheck --version
          shellcheck scripts/*.sh scripts/em statusline.sh
